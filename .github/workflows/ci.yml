name: ScholarFlow AI — Green CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: 🛡️ Backend Unit Tests, Integration API Tests & Agent Eval
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install Backend Dependencies
      run: |
        cd backend
        npm ci

    - name: Initialize Prisma Database Schema
      run: |
        cd backend
        npx prisma generate
        npx prisma db push --skip-generate

    - name: Run Jest Unit & Integration Tests (21/21 Pass)
      env:
        NODE_ENV: test
        JWT_SECRET: scholarflow_ci_secret_key_12345
        DATABASE_URL: "file:./dev.db"
      run: |
        cd backend
        npm test

    - name: Run Document Agent Adversarial Eval Suite (20/20 Pass)
      env:
        NODE_ENV: test
      run: |
        cd backend
        npm run test:eval

  frontend-build:
    name: ⚡ Frontend Oxlint Check & Production Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: Run Oxlint Code Quality Check
      run: |
        cd frontend
        npm run lint

    - name: Build Vite Production Assets
      run: |
        cd frontend
        npm run build
